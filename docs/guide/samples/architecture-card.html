<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandboxed HTML Preview</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; background: #f8fafc; color: #0f172a; }
      .card { max-width: 480px; margin: 0 auto; padding: 24px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 16px; color: #475569; line-height: 1.5; }
      button { padding: 8px 14px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sandboxed HTML Preview</h1>
      <p>This HTML file runs inside a strict <code>sandbox="allow-scripts"</code> iframe with no same-origin access.</p>
      <button onclick="document.getElementById('out').textContent = 'Clicked at ' + new Date().toLocaleTimeString()">Test Interaction</button>
      <p id="out" style="margin-top: 12px; font-weight: 600;"></p>
    </div>
  </body>
</html>
